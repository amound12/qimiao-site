<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site_name }} · {{ site_slogan }}{% endblock %}</title>
<meta name="description" content="{{ site_intro }}">
<meta name="theme-color" content="#FBFAF7">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site_name }} · {{ site_slogan }}">
<meta property="og:description" content="{{ site_intro }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M13 2.5C13.7 8 15.4 9.9 21.5 10.6C15.7 11.7 13.9 13.5 13.4 20.5C12.6 14.7 10.9 12.4 4.5 11.3C10.6 9.9 12.3 8.3 13 2.5Z' fill='%23FF6B4A'/%3E%3C/svg%3E">
<!-- 字体已自托管（core/static/fonts/）：不依赖 Google Fonts，国内访问不卡首屏 -->
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/site.css">
{% block head %}{% endblock %}
</head>
<body>

<!-- M1 · 导航（导航项由模块注册中心动态生成） -->
<header class="site-nav">
  <a class="logo" href="/" aria-label="{{ site_name }} 首页">
    <svg class="doodle" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2.5C13.7 8 15.4 9.9 21.5 10.6C15.7 11.7 13.9 13.5 13.4 20.5C12.6 14.7 10.9 12.4 4.5 11.3C10.6 9.9 12.3 8.3 13 2.5Z" fill="#FF6B4A" stroke="#26231F" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <span class="logo-name">{{ site_name }}</span>
  </a>
  <div class="nav-right">
    <nav class="nav-links" aria-label="主导航">
      {% for item in nav_items %}
      <a href="{{ item.url }}" {% if item.active %}class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a class="btn btn-primary" href="/about">打个招呼</a>
  </div>
  <button class="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 7.2C9 6.4 15 6.6 20.5 7.4M3.5 12.1C9 11.4 15 11.6 20.5 12.3M3.5 17C9 16.5 15 16.6 20.5 17.2" stroke="#26231F" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main>
{% block content %}{% endblock %}
</main>

<!-- 手绘分隔线 -->
<svg class="hand-divider" viewBox="0 0 1280 20" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 12C120 5 260 16 400 10C540 4 680 15 820 9C960 3 1100 14 1276 8" stroke="#E3DED4" stroke-width="2.5" stroke-linecap="round"/></svg>

<!-- M3 · 页脚 -->
<footer class="site-footer">
  <div class="footer-top">
    <div class="footer-brand">
      <div class="footer-logo">
        <svg class="doodle" width="20" height="20" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2.5C13.7 8 15.4 9.9 21.5 10.6C15.7 11.7 13.9 13.5 13.4 20.5C12.6 14.7 10.9 12.4 4.5 11.3C10.6 9.9 12.3 8.3 13 2.5Z" fill="#FF6B4A"/></svg>
        <span class="logo-name">{{ site_name }}</span>
      </div>
      <p class="footer-slogan">{{ site_slogan }}</p>
    </div>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="/about">关于</a>
      <a href="https://github.com/amound12" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:amound12@163.com">邮箱</a>
    </nav>
  </div>
  <div class="footer-bottom">
    <span>2026 {{ site_name }} · 还没想好写什么，先放着</span>
    <span class="made-with">Made with curiosity</span>
  </div>
</footer>

<script src="/static/site.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
