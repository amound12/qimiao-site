# 奇妙小站 · Nginx 反向代理配置
# 用法（见 docs/部署手册.md 第 6 步）：
#   1. 把 your-domain.com 换成你的域名（没域名就填服务器公网 IP）
#   2. cp qimiao.conf /etc/nginx/sites-available/qimiao.conf
#   3. ln -s /etc/nginx/sites-available/qimiao.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
# HTTPS 由 certbot 自动改写本文件（部署手册第 7 步），不用手动配证书。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;    # TODO: 换成你的域名或服务器 IP

    access_log /var/log/nginx/qimiao.access.log;
    error_log  /var/log/nginx/qimiao.error.log;

    # 超时给足：万一以后上大文件上传不至于被掐
    client_max_body_size 10m;

    # 文本资源开 gzip（字体 woff2/jpg 已是压缩格式，不再重复压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript text/plain text/xml image/svg+xml;

    # 安全响应头（CSP/X-Frame-Options 等）由应用统一设置，这里不重复，避免双份 header

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

# HTTPS 上线后（certbot 会自动改写本文件），建议补一段 HSTS：
#   add_header Strict-Transport-Security "max-age=31536000" always;
